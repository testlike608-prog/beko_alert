# =====================================================================
# لازم Docker Desktop يكون في وضع Windows containers
# =====================================================================
services:
  beko:
    build: .
    image: beko-vision:latest
    container_name: beko-vision

    ports:
      - "5000:5000"

    volumes:
      # إعدادات وبيانات العميل بتفضل بره الصورة، عشان التحديث
      # ما يمسحش الماپينج ولا المستخدمين ولا البرامج
      - ./data:C:/app/data
      - ./CreateProgram:C:/app/CreateProgram
      - ./config.json:C:/app/config.json
      - ./logins.csv:C:/app/logins.csv

      # الطريقة (ب) لـ VisionMaster — تركيب من الجهاز بدل التسطيب في الصورة.
      # شيل التعليق لو هتجرّبها، وعدّل المسار حسب نسخة العميل.
      # - "C:/Program Files/VisionMaster4.4.0:C:/VisionMaster:ro"

    environment:
      # سيرفرات VisionMaster شغالة على الجهاز نفسه مش جوه الكونتينر.
      # host.docker.internal بيوصّل للجهاز المضيف من جوه الكونتينر.
      # (الكود لسه بيقرا الـ IPs من ClientsClass — شوف DOCKER.md)
      - BEKO_VISION_HOST=host.docker.internal

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
